# Add inside the existing server {} for this website.
# Inherits the existing document root; use the same path as --base-url.
location ^~ /ios/ {
    index index.html;
    types {
        text/html html;
        application/xml xml;
        text/xml plist;
        image/png png;
        application/octet-stream ipa;
    }
    try_files $uri $uri/ =404;
}
